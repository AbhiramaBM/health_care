name: health_care
description: "Healthcare Clinical Management & Patient Monitoring Flutter App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & HTTP
  dio: ^5.4.0
  http: ^1.2.0
  
  # Real-time WebSockets
  socket_io_client: ^2.0.3+1
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage & Auth persistence
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI & Media
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
